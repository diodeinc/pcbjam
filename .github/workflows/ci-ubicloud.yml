name: Diode CI (WASM build + e2e)

# Main/PR pipeline: build KiCad WASM tools + run the wxWidgets + KiCad e2e
# suites on a Blacksmith runner. The actual recipe lives in the reusable
# wasm-build.yml (the SINGLE build definition) — this is just the main/PR caller.
# The tag release (release.yml) calls the same recipe with the same inputs and
# publishes editor bytes before regression tests, using the same build recipe.
#
# Routine edits under scripts/ do NOT bust the WASM output cache — only the subset
# in scripts/deploy/wasm-cache-hash.mjs does. For inputs the sc-hash can't see
# (base-image / apt drift, a bad cache) bump .ci-cache-epoch; for a one-off
# rebuild put [no-cache] or [rebuild-wasm] in the commit message / PR title.
#
# PRs ignore documentation/site-only edits; every main push publishes a pin.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["docs/**", "**.md", "site/**"]
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Bypass the KiCad WASM output cache (force a full rebuild this run)"
        type: boolean
        required: false
        default: false

concurrency:
  # New commits must not wait for an older commit's regression tests.
  group: diode-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  embedded-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm -C apps/embedded-editor install --frozen-lockfile
      - run: pnpm -C apps/embedded-editor typecheck
      # Includes a fixture distribution build and source/notice integrity tests;
      # no private host checkout or native build is needed for this app gate.
      - run: pnpm -C apps/embedded-editor test

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'diodeinc/pcbjam'
    uses: ./.github/workflows/wasm-build.yml
    permissions:
      contents: write
    with:
      build_3d_viewer: "OFF"
      run_tests: true
      publish_release: true
      no_cache: ${{ inputs.no_cache || false }}

  check:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    uses: ./.github/workflows/wasm-build.yml
    permissions:
      contents: read
    with:
      # This is the integration configuration validated for Diode's browser image.
      build_3d_viewer: "OFF"
      run_tests: true
      no_cache: ${{ inputs.no_cache || false }}
