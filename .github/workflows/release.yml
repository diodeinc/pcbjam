name: Diode release

on:
  push:
    tags: ["diode-v*"]

permissions:
  contents: write

concurrency:
  group: diode-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'diodeinc/pcbjam'
    uses: ./.github/workflows/wasm-build.yml
    with:
      build_3d_viewer: "OFF"
      run_tests: true
      upload_output: true
      publish_release: true
